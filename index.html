<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Expense Tracker</h2>
    
    <!-- Balance Header -->
    <div class="balance-container">
      <h4>Total Expense</h4>
      <h1 id="total-amount">₹0.00</h1>
    </div>

    <!-- Input Form -->
    <form id="expense-form">
      <div class="form-control">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Snacks, Transport" required>
      </div>
      <div class="form-control">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 150" step="any" required>
      </div>
      <div class="form-control">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Food">Food & Drinks</option>
          <option value="Transport">Travel & Transport</option>
          <option value="College">College & Books</option>
          <option value="Gaming">Games & Subscriptions</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit" class="btn">Add Expense</button>
    </form>

    <!-- Expense List -->
    <h3>Transaction History</h3>
    <ul id="expense-list" class="list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
